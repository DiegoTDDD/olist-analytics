[project]
name = "olist-analytics"
version = "1.1.0"
description = "Star schema in dbt + DuckDB over the Olist dataset: how late delivery hits satisfaction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Alves" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "T20"]
ignore = ["E402", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["ANN", "T20", "E501"]
"dashboard.py" = ["ANN", "T20", "E501"]
"olist_dbt/models/staging/dashboard.py" = ["ANN"]
