
name: 'olist_dbt'
version: '1.0.0'

profile: 'olist_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Models are views unless a model says otherwise; fct_orders and fct_order_items are incremental
# tables (docs/adr/0006).
models:
  olist_dbt:
    +materialized: view
