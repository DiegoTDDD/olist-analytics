version: 2

models:
  - name: fct_orders
    description: "One row per order with delivery, payment, and satisfaction measures"
    columns:
      - name: order_id
        description: "Unique identifier for each order"
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: is_delayed
        description: "True when the order arrived on a later calendar day than promised (delay_days > 0)"
      - name: delay_days
        description: "Delivery date minus promised date, in days; negative = early, null = not delivered"
      - name: delivery_days
        description: "Days from purchase to delivery"
      - name: review_score
        description: "Most recent review score for the order (1-5); null if never reviewed"
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
              config:
                where: "review_score is not null"

  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: dim_sellers
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null

  - name: dim_dates
    columns:
      - name: date_day
        tests:
          - unique
          - not_null
  - name: fct_order_items
    description: "One row per item sold, with the order's status, date, delay and review carried on it"
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
