version: 2

sources:
  - name: olist
    description: >
      The nine raw tables of the Brazilian E-Commerce Public Dataset by Olist (Kaggle), loaded by
      load_data.py, in full or as known at the end of a given day (a replay of the feed, see
      docs/adr/0006). Every table carries _loaded_at, the time of the load.
    schema: main
    config:
      loaded_at_field: _loaded_at
      # A daily feed may miss one run: warn after a day, fail after two.
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: orders
        columns:
          - name: order_id
            tests: [unique, not_null]
          - name: customer_id
            tests: [not_null]
          - name: order_purchase_timestamp
            tests: [not_null]
      - name: customers
        columns:
          - name: customer_id
            tests: [unique, not_null]
      - name: order_items
        columns:
          - name: order_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('olist', 'orders')
                    field: order_id
      - name: order_payments
        columns:
          - name: order_id
            tests: [not_null]
      - name: order_reviews
        columns:
          - name: review_score
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [1, 2, 3, 4, 5]
      - name: products
        columns:
          - name: product_id
            tests: [unique, not_null]
      - name: sellers
        columns:
          - name: seller_id
            tests: [unique, not_null]
      - name: geolocation
      - name: product_category_name_translation
        columns:
          - name: product_category_name
            tests: [unique, not_null]
