name: dbt check

# Builds everything from the raw files, the way the README does: downloads the nine CSV files
# (checked against pinned SHA-256 hashes), loads them with load_data.py, runs `dbt build`
# (14 models and 35 tests), exports fct_orders and checks it equals the committed export the
# dashboard reads, then starts the dashboard. It also builds the dbt documentation (lineage graph,
# column descriptions, tests) as a downloadable artifact, and publishes it to GitHub Pages once
# Pages is enabled (Settings > Pages > Source: GitHub Actions, then set the repository variable
# DBT_DOCS_PAGES to true).
on:
  push:
    paths:
      - "olist_dbt/**"
      - load_data.py
      - export_marts.py
      - dashboard.py
      - "data/marts/**"
      - "scripts/**"
      - "requirements*.txt"
      - ".github/workflows/dbt-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the dashboard and dbt requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dbt.txt ruff
          pip check

      - name: Lint the Python code
        run: ruff check .

      - name: "README step 1: download and verify the nine CSV files"
        run: scripts/download_data.sh

      - name: "README step 3: load them into DuckDB"
        run: python load_data.py

      - name: "README step 4: dbt build (models + tests)"
        working-directory: olist_dbt
        run: dbt build

      - name: "README step 5: export fct_orders; it must equal the committed export"
        run: |
          git show HEAD:data/marts/fct_orders.parquet > /tmp/committed.parquet
          python export_marts.py
          python - <<'PY'
          import duckdb
          con = duckdb.connect()
          new, old = "data/marts/fct_orders.parquet", "/tmp/committed.parquet"
          rows = [con.execute(f"select count(*) from '{f}'").fetchone()[0] for f in (new, old)]
          only_new = con.execute(f"select count(*) from (select * from '{new}' except all select * from '{old}')").fetchone()[0]
          only_old = con.execute(f"select count(*) from (select * from '{old}' except all select * from '{new}')").fetchone()[0]
          print(f"rebuilt={rows[0]:,} committed={rows[1]:,} only-in-rebuilt={only_new} only-in-committed={only_old}")
          assert rows[0] == rows[1] and only_new == 0 and only_old == 0, "rerun export_marts.py and commit data/marts/"
          PY

      - name: "README step 6: the dashboard renders (both entry points)"
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          for path in ["dashboard.py", "olist_dbt/models/staging/dashboard.py"]:
              at = AppTest.from_file(path, default_timeout=120).run()
              assert not at.exception, [e.value for e in at.exception]
              print(path, [(m.label, m.value) for m in at.metric])
          PY

      - name: Generate the dbt documentation
        working-directory: olist_dbt
        run: |
          dbt docs generate --static
          mkdir -p ../site
          cp target/static_index.html ../site/index.html

      - name: Upload the documentation as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: site/index.html

      - name: Upload the documentation for GitHub Pages
        if: github.ref == 'refs/heads/main' && vars.DBT_DOCS_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  docs:
    needs: dbt
    if: github.ref == 'refs/heads/main' && vars.DBT_DOCS_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
